name: Load reviewed Supabase images
description: Load this run's verified public image bundle without restoring database volumes.
runs:
  using: composite
  steps:
    - uses: supabase/setup-cli@v1
      with:
        version: 2.109.0
    - uses: actions/download-artifact@v4
      with:
        name: supabase-images
        path: .ci-supabase-images
    - name: Validate and load the image bundle
      shell: bash
      run: node scripts/ci-supabase-images.mjs load .ci-supabase-images
