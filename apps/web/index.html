<!doctype html>
<html lang="en" data-skin="tryst" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the tab bar pad itself past the home indicator (safe-area inset) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Installable/PWA basics. The icon is the Wordmark's gold crescent on the brand night. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0612" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Reverie — Find your next read in your own library</title>
    <meta
      name="description"
      content="Find your next read among the books you own or have borrowed. Keep notes, rereads, and series together in one of nine personal reading rooms."
    />
    <link rel="canonical" href="https://reveriereads.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reverie" />
    <meta property="og:title" content="Reverie — Find your next read in your own library" />
    <meta
      property="og:description"
      content="Find your next read in your own library. Keep your books, reading history, and series in a room that feels like yours."
    />
    <meta property="og:url" content="https://reveriereads.app/" />
    <meta property="og:image" content="https://reveriereads.app/reverie-next-read-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Reverie — find your next read in your own library" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reverie — Find your next read in your own library" />
    <meta
      name="twitter:description"
      content="Find your next read in your own library. Keep your books, reading history, and series in a room that feels like yours."
    />
    <meta name="twitter:image" content="https://reveriereads.app/reverie-next-read-share.png" />
    <link rel="stylesheet" href="/fonts/brand.css" />
    <!-- The neutral front-door tokens must be available before the boot script can mark an
         incomplete appearance. Vite fingerprints this stylesheet in production. -->
    <link rel="stylesheet" href="/src/styles/brand.css?direct" />
    <!-- Only the ACTIVE skin's font pairing is loaded (below, pre-paint), not all nine families.
         Fonts are SELF-HOSTED under /fonts (scripts/fetch-fonts.mjs) — no third-party host.
         The Skin Gallery loads the rest on demand. Keep this map in sync with src/skin/fonts.ts. -->
    <script>
      // Set skin + light/dark mode before first paint to avoid a flash of the wrong identity.
      ;(function () {
        function holdAppearance() {
          document.documentElement.setAttribute('data-appearance-pending', '')
          document.documentElement.classList.add('gold-brand')
        }
        try {
          var valid = { tryst: 1, grimoire: 1, aphelion: 1, marrow: 1, umbra: 1, folio: 1, hearth: 1, almanac: 1, bloom: 1 }
          var storedSkin = localStorage.getItem('reverie.skin')
          var skin = storedSkin
          if (!valid[skin]) skin = 'tryst'
          // Load ONLY the active skin's font pairing, pre-paint (each @font-face carries font-display: swap → no FOIT).
          var FONT = {
            tryst: '/fonts/tryst.css',
            grimoire: '/fonts/grimoire.css',
            aphelion: '/fonts/aphelion.css',
            marrow: '/fonts/marrow.css',
            umbra: '/fonts/umbra.css',
            folio: '/fonts/folio.css',
            hearth: '/fonts/hearth.css',
            almanac: '/fonts/almanac.css',
            bloom: '/fonts/bloom.css',
          }
          var fl = document.createElement('link')
          fl.rel = 'stylesheet'
          fl.href = FONT[skin]
          fl.setAttribute('data-skin-font', '')
          document.head.appendChild(fl)
          var storedMode = localStorage.getItem('reverie.mode')
          var mode = storedMode
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system'
          if (!valid[storedSkin] || (storedMode !== 'light' && storedMode !== 'dark' && storedMode !== 'system')) {
            holdAppearance()
          }
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : mode
          document.documentElement.dataset.skin = skin
          document.documentElement.dataset.mode = resolved
        } catch (e) {
          holdAppearance()
          document.documentElement.dataset.skin = 'tryst'
          document.documentElement.dataset.mode = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
