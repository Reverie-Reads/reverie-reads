<!doctype html>
<html lang="en" data-skin="tryst" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Edge-to-edge room; safe-area.css protects content from the notch and home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Installable/PWA basics. The approved reader-and-moon mark is shared with the front door and every room. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#10121c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Midniht — A place for your reading life</title>
    <meta
      name="description"
      content="A personal library for the books, moods, and memories you carry. Find your next read among the books you own or have borrowed, in a room that feels like you."
    />
    <link rel="canonical" href="https://midniht.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Midniht" />
    <meta property="og:title" content="Midniht — A place for your reading life" />
    <meta
      property="og:description"
      content="Find your next read in your own library. Keep your books, reading history, and series in a room that feels like yours."
    />
    <meta property="og:url" content="https://midniht.app/" />
    <meta property="og:image" content="https://midniht.app/midniht/midniht-share-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Midniht — the quiet place your stories return to" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Midniht — A place for your reading life" />
    <meta
      name="twitter:description"
      content="Find your next read in your own library. Keep your books, reading history, and series in a room that feels like yours."
    />
    <meta name="twitter:image" content="https://midniht.app/midniht/midniht-share-1200x630.png" />
    <link rel="stylesheet" href="/fonts/brand.css" />
    <!-- The neutral front-door tokens must be available before the boot script can mark an
         incomplete appearance. Vite fingerprints this stylesheet in production. -->
    <link rel="stylesheet" href="/src/styles/brand.css?direct" />
    <!-- Only the ACTIVE skin's font pairing is loaded (below, pre-paint), not all nine families.
         Fonts are SELF-HOSTED under /fonts (scripts/fetch-fonts.mjs) — no third-party host.
         The Skin Gallery loads the rest on demand. Keep this map in sync with src/skin/fonts.ts. -->
    <script>
      // Set skin + light/dark mode before first paint to avoid a flash of the wrong identity.
      ;(function () {
        function holdAppearance() {
          document.documentElement.setAttribute('data-appearance-pending', '')
          document.documentElement.classList.add('gold-brand')
        }
        try {
          var valid = { tryst: 1, grimoire: 1, aphelion: 1, marrow: 1, umbra: 1, folio: 1, hearth: 1, almanac: 1, bloom: 1 }
          var storedSkin = localStorage.getItem('reverie.skin')
          var skin = storedSkin
          if (!valid[skin]) skin = 'tryst'
          // Load ONLY the active skin's font pairing, pre-paint (each @font-face carries font-display: swap → no FOIT).
          var FONT = {
            tryst: '/fonts/tryst.css',
            grimoire: '/fonts/grimoire.css',
            aphelion: '/fonts/aphelion.css',
            marrow: '/fonts/marrow.css',
            umbra: '/fonts/umbra.css',
            folio: '/fonts/folio.css',
            hearth: '/fonts/hearth.css',
            almanac: '/fonts/almanac.css',
            bloom: '/fonts/bloom.css',
          }
          var fl = document.createElement('link')
          fl.rel = 'stylesheet'
          fl.href = FONT[skin]
          fl.setAttribute('data-skin-font', '')
          document.head.appendChild(fl)
          var storedMode = localStorage.getItem('reverie.mode')
          var mode = storedMode
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system'
          if (!valid[storedSkin] || (storedMode !== 'light' && storedMode !== 'dark' && storedMode !== 'system')) {
            holdAppearance()
          }
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : mode
          document.documentElement.dataset.skin = skin
          document.documentElement.dataset.mode = resolved
        } catch (e) {
          holdAppearance()
          document.documentElement.dataset.skin = 'tryst'
          document.documentElement.dataset.mode = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <!-- This recovery UI must work even when the application module cannot execute. -->
    <section
      id="boot-recovery"
      hidden
      aria-labelledby="boot-recovery-title"
      style="position: fixed; inset: 0; z-index: 9999; overflow: auto; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: Canvas; color: CanvasText; font: 16px/1.6 system-ui"
    >
      <div style="max-width: 32rem; margin: 12vh auto">
        <h1 id="boot-recovery-title" style="font: 600 28px/1.2 system-ui">Midniht couldn’t open.</h1>
        <p>The app files may be out of date or your connection may be interrupted.</p>
        <p>Reload app files to try again. This keeps your sign-in, library, and saved drafts.</p>
        <button id="boot-recovery-reload" type="button" style="min-height: 44px; padding: 10px 20px; font: inherit">Reload app files</button>
        <p id="boot-recovery-status" role="status"></p>
      </div>
    </section>
    <div id="root"></div>
    <script id="boot-recovery-script">
      ;(function () {
        var panel = document.getElementById('boot-recovery')
        var root = document.getElementById('root')
        var button = document.getElementById('boot-recovery-reload')
        var status = document.getElementById('boot-recovery-status')
        function rendered() {
          return root.childElementCount > 0
        }
        function show() {
          if (!rendered()) panel.hidden = false
        }
        // Resource errors can precede React and its error boundary. A timer also covers stalled
        // module downloads. Never interrupt a mounted screen or discard a reader's open form.
        var timer = setTimeout(show, 15000)
        window.addEventListener('error', function (event) {
          if (event.target instanceof HTMLScriptElement) show()
        }, true)
        var observer = new MutationObserver(function () {
          if (rendered()) {
            clearTimeout(timer)
            panel.hidden = true
            observer.disconnect()
          }
        })
        observer.observe(root, { childList: true })
        button.addEventListener('click', async function () {
          button.disabled = true
          status.textContent = 'Refreshing app files…'
          try {
            if ('caches' in window) {
              var keys = await caches.keys()
              await Promise.all(keys.filter(function (key) {
                return /^(midniht|reverie)-shell-v\d+$/.test(key)
              }).map(function (key) { return caches.delete(key) }))
            }
            if ('serviceWorker' in navigator) {
              var registrations = await navigator.serviceWorker.getRegistrations()
              await Promise.all(registrations.filter(function (registration) {
                var worker = registration.active || registration.waiting || registration.installing
                return worker && new URL(worker.scriptURL).origin === location.origin &&
                  new URL(worker.scriptURL).pathname === '/sw.js'
              }).map(function (registration) { return registration.unregister() }))
            }
            location.reload()
          } catch (error) {
            status.textContent = 'The app files could not be refreshed. Check your connection and try again.'
            button.disabled = false
          }
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
